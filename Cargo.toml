[package]
name = "kanband"
version = "0.1.0"
edition = "2024"
description = "Kanban, das ein Ordner ist — Aufgaben und Boards als Markdown, Git als Gedächtnis"
license = "MIT"

[[bin]]
name = "kanbanD"
path = "src/main.rs"

[lib]
name = "kanband"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }

[profile.release]
opt-level = 3
